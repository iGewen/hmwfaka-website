<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="950" cy="120" r="200" fill="url(#accent)" opacity="0.3"/>

  <!-- Logo -->
  <g transform="translate(100, 230)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#accent)"/>
    <g transform="translate(14, 24)" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="6" width="52" height="32" rx="4"/>
      <line x1="0" y1="18" x2="52" y2="18"/>
      <circle cx="10" cy="28" r="3" fill="#fff" stroke="none"/>
    </g>
  </g>

  <!-- Title -->
  <text x="200" y="280" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="700">
    HmwCard
  </text>
  <text x="100" y="380" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="400">
    自动发卡 · 多渠道支付 · 一键部署
  </text>
  <text x="100" y="440" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="500">
    何慕雯发卡系统 · 2000+ 商户的选择
  </text>
</svg>
